name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only: every Mac sold since 2020 is arm64, and the
          # Intel runner is being retired.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin obsidian-tui

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="obsidian-tui-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/obsidian-tui" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          # Hash from inside dist/ so the file records a bare filename —
          # `shasum -c` resolves the path relative to itself, and a `dist/`
          # prefix makes verification fail for whoever downloads it.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="obsidian-tui-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/obsidian-tui.exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          7z a "dist/$name.zip" "./dist/$name/*"
          # `sha256sum` from Git Bash, for a file in the same format the unix
          # archives use; certutil's output is not `-c` checkable.
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
