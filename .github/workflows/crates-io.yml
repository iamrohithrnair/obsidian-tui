name: crates.io

# Publishes the workspace to crates.io on a release tag.
#
# Authentication is OIDC trusted publishing, not a stored token: the runner
# proves which repository and workflow it is, and crates.io hands back a token
# good for thirty minutes. Nothing long-lived sits in repository secrets.
#
# This cannot bootstrap itself. A trusted publisher can only be configured on a
# crate that already exists, so the first version of each of the four crates has
# to be published by hand:
#
#   cargo login                       # once, interactively
#   cargo publish -p emeraldian-core
#   cargo publish -p emeraldian-theme
#   cargo publish -p emeraldian-agent
#   cargo publish -p emeraldian       # last: it depends on the other three
#
# Then, for each crate, add a trusted publisher on crates.io pointing at this
# repository and this workflow file, and every release after that is automatic.
#
# To check that configuration without waiting for a release, run this by hand
# with `verify_only` set. It authenticates and stops, so a green run means
# crates.io accepts this workflow's identity. Worth doing after changing the
# workflow's filename, or the repository's, since either invalidates the
# trusted publisher silently.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.4.0"
        required: true
      verify_only:
        description: "Only check that trusted publishing works, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read
  # Required for the OIDC exchange. Without it the auth step fails.
  id-token: write

concurrency:
  group: crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "emeraldian") | .version')"
          if [ "${RELEASE_TAG#v}" != "$manifest" ]; then
            echo "::error::tag ${RELEASE_TAG} does not match Cargo.toml ${manifest}"
            exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"

      - name: Work out whether anything needs publishing
        id: needed
        shell: bash
        run: |
          set -euo pipefail
          # crates.io rejects requests without a User-Agent with a 403, which
          # `curl -f` reports the same way as a 404. Sending one is the
          # difference between "already published" and "always publish".
          ua="emeraldian-release (https://github.com/iamrohithrnair/emeraldian)"
          todo=""
          for crate in emeraldian-core emeraldian-theme emeraldian-agent emeraldian; do
            if curl -sfo /dev/null -A "$ua" "https://crates.io/api/v1/crates/${crate}/${VERSION}"; then
              echo "${crate} ${VERSION} is already published"
            else
              todo="${todo} ${crate}"
            fi
          done
          echo "crates=${todo# }" >> "$GITHUB_OUTPUT"
          if [ -z "$todo" ]; then
            echo "nothing to publish"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # Authenticating is itself a failure when no trusted publisher is
      # configured yet, so it has to sit behind the check rather than in front
      # of it. Otherwise a release with nothing left to publish fails on the
      # step that was only ever there to enable the work being skipped.
      #
      # That skip has a cost: on a release where everything is already published
      # the OIDC exchange never runs, so a green job does not prove the trusted
      # publishing config is right. `verify_only` exists to force it, and is the
      # one case where authenticating with nothing to publish is the point.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.needed.outputs.any == 'true' || inputs.verify_only

      - name: Report that trusted publishing works
        if: inputs.verify_only
        shell: bash
        run: |
          set -euo pipefail
          # Reaching this line means crates.io accepted the workflow's identity
          # and issued a token. The token itself is never printed.
          echo "::notice::Trusted publishing is configured correctly for this repository and workflow."
          echo "Nothing was published: verify_only was set."

      - name: Publish, dependencies before dependents
        if: steps.needed.outputs.any == 'true' && ! inputs.verify_only
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.needed.outputs.crates }}
        run: |
          set -euo pipefail
          # The list is already in dependency order: emeraldian depends on the
          # other three, and crates.io rejects a crate whose dependencies it has
          # never seen.
          for crate in $CRATES; do
            echo "publishing ${crate} ${VERSION}"
            cargo publish -p "${crate}"
          done
