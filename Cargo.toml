[workspace]
resolver = "2"
members = ["crates/otui-core", "crates/otui-theme", "crates/otui-agent", "crates/otui"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/iamrohithrnair/obsidian-tui"
description = "obsidian-tui — an Obsidian-like terminal UI for your vault: notes, live-preview markdown, backlinks and a force-directed graph"
keywords = ["obsidian", "tui", "notes", "markdown", "graph"]
categories = ["command-line-utilities", "text-editors"]

[workspace.dependencies]
otui-core = { path = "crates/otui-core", version = "0.1.1" }
otui-theme = { path = "crates/otui-theme", version = "0.1.1" }
otui-agent = { path = "crates/otui-agent", version = "0.1.1" }

ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
anyhow = "1"
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# Dependencies are slow to compile but hot in the render loop; optimize them
# even in debug builds so `cargo run` is still smooth at 60fps.
[profile.dev.package."*"]
opt-level = 3
